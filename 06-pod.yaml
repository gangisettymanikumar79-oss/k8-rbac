apiVersion: v1
kind: Pod
metadata:
  name: aws-cli # pod name
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    purpose: poc
spec:
  serviceAccountName: roboshop-secret-reader
  containers:
  - name: aws-cli # container name
    image: amazon/aws-cli # by default it will get from docker hub
    command: ["sleep","1000"]
    
    